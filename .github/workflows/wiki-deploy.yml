name: Deploy Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-deploy.yml"

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Opt-in: set repository variable DEPLOY_WIKI=true and add the Cloudflare
    # secrets below before this fork will publish the wiki. Keeps CI green until
    # the maintainer connects their own Cloudflare Pages project.
    if: ${{ vars.DEPLOY_WIKI == 'true' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy wiki
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy wiki --project-name=vibe-trading-kr-wiki --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
